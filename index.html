<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 10px; margin: 0; background-color: #f8f9fa; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #333; }
    input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; padding: 10px; background-color: #1a73e8; color: white; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #1557b0; }
    #status { margin-top: 10px; text-align: center; font-size: 13px; }
  </style>
</head>
<body>

  <form id="expenseForm">
    <div class="form-group">
      <label>วันที่:</label>
      <input type="date" id="date" required>
    </div>

    <div class="form-group">
      <label>ผู้บันทึก:</label>
      <select id="person" required>
        <option value="ปลา">ปลา</option>
        <option value="เอก">เอก</option>
      </select>
    </div>

    <div class="form-group">
      <label>หมวดหมู่:</label>
      <select id="category" required>
        <option value="อาหาร/เครื่องดื่ม">อาหาร/เครื่องดื่ม</option>
        <option value="ค่าเดินทาง">ค่าเดินทาง</option>
        <option value="สาธารณูปโภค">สาธารณูปโภค</option>
        <option value="ของใช้ในบ้าน">ของใช้ในบ้าน</option>
        <option value="อื่นๆ">อื่นๆ</option>
      </select>
    </div>

    <div class="form-group">
      <label>รายละเอียด:</label>
      <input type="text" id="description" placeholder="เช่น ค่าข้าวเย็น, ค่าน้ำมัน" required>
    </div>

    <div class="form-group">
      <label>จำนวนเงิน (บาท):</label>
      <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required>
    </div>

    <button type="submit" id="btnSubmit">บันทึกข้อมูล</button>
  </form>

  <div id="status"></div>

  <script>
    // กำหนดวันที่เริ่มต้นเป็นวันนี้
    document.getElementById('date').valueAsDate = new Date();

    document.getElementById('expenseForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btnSubmit');
      const statusDiv = document.getElementById('status');
      
      btn.disabled = true;
      btn.innerText = 'กำลังบันทึก...';
      statusDiv.innerText = '';

      const formData = {
        date: document.getElementById('date').value,
        person: document.getElementById('person').value,
        category: document.getElementById('category').value,
        description: document.getElementById('description').value,
        amount: document.getElementById('amount').value
      };

      // เรียกฟังก์ชัน saveExpense ใน Apps Script
      google.script.run
        .withSuccessHandler(function(response) {
          if (response.success) {
            statusDiv.style.color = 'green';
            statusDiv.innerText = '✅ บันทึกข้อมูลสำเร็จ!';
            document.getElementById('description').value = '';
            document.getElementById('amount').value = '';
          } else {
            statusDiv.style.color = 'red';
            statusDiv.innerText = '❌ เกิดข้อผิดพลาด: ' + response.message;
          }
          btn.disabled = false;
          btn.innerText = 'บันทึกข้อมูล';
        })
        .saveExpense(formData);
    });
  </script>
</body>
</html>
